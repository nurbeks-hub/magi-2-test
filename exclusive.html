<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MAGI-2 — Эксклюзив</title>
<style>
/* Shared look for every tab of the comparison site (Стресс-сет, Genjutsu).
   Tokens first; then the app bar with tabs and the run line. See STYLE.md. */
:root {
  color-scheme: dark;
  /* surfaces, darkest to lightest */
  --surface-canvas: #1c1c1e;     /* page behind everything */
  --surface-side: #222224;       /* scene list, panels */
  --surface-raised: #2c2c2e;     /* fields, buttons, hover rows */
  --surface-video: #000;         /* behind video */
  --surface-empty: #18181a;      /* tile without a result */
  --line: rgba(255, 255, 255, .08);        /* hairline separators */
  --line-strong: rgba(255, 255, 255, .16);
  /* text */
  --text: #f2f2f7;
  --text-2: rgba(235, 235, 245, .62);
  --text-3: rgba(235, 235, 245, .36);
  /* the one accent: marks magi-2, selection, focus */
  --accent: #f5c84c;
  --accent-ink: #1c1c1e;          /* text on accent */
  /* status, used only in dots and the progress line */
  --ok: #30d158; --work: #ff9f0a; --bad: #ff453a; --idle: rgba(235, 235, 245, .22);
  /* type: one system family */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --fs-xs: 12px; --fs-s: 13px; --fs-m: 15px; --fs-l: 17px; --fs-xl: 22px;
  /* spacing on a 4 px step */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px;
  --radius: 8px; --radius-s: 6px;
  --appbar-h: 48px; --side-w: 288px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface-canvas); color: var(--text); }
body { font: 400 var(--fs-m)/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* buttons and fields, macOS-like */
.btn { appearance: none; background: var(--surface-raised); border: 0; border-radius: var(--radius-s);
  height: 28px; padding: 0 var(--sp-3); font-size: var(--fs-s); cursor: pointer; display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap; }
.btn:hover { background: #3a3a3c; }
.btn.plain { background: transparent; color: var(--text-2); }
.btn.plain:hover { background: var(--surface-raised); color: var(--text); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.field { appearance: none; background: var(--surface-raised); border: 0; border-radius: var(--radius-s); height: 28px; padding: 0 var(--sp-2); font-size: var(--fs-s); width: 100%; }
select.field { padding-right: 24px; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position: calc(100% - 13px) 12px, calc(100% - 9px) 12px; background-size: 4px 4px; background-repeat: no-repeat; }

/* segmented control */
.segmented { display: inline-flex; background: rgba(118, 118, 128, .24); border-radius: 7px; padding: 2px; gap: 2px; }
.segmented > * { appearance: none; border: 0; background: transparent; color: var(--text-2); font-size: var(--fs-s); height: 24px; padding: 0 var(--sp-3);
  border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; white-space: nowrap; }
.segmented > *:hover { color: var(--text); }
.segmented > .on { background: #636366; color: var(--text); font-weight: 500; }

/* app bar shared by all tabs */
.appbar { position: fixed; inset: 0 0 auto 0; height: var(--appbar-h); z-index: 30; display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-4); background: rgba(28, 28, 30, .92); backdrop-filter: saturate(160%) blur(20px); -webkit-backdrop-filter: saturate(160%) blur(20px);
  border-bottom: 1px solid var(--line); }
.appbar-status { flex: 1; min-width: 0; font-size: var(--fs-s); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-status b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.appbar-actions { display: flex; align-items: center; gap: var(--sp-2); }
.appbar-progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; display: flex; background: transparent; }
.appbar-progress i { display: block; height: 100%; width: 0; transition: width .4s ease; }
.appbar-progress .ok { background: var(--ok); } .appbar-progress .work { background: var(--work); } .appbar-progress .bad { background: var(--bad); }
@media (prefers-reduced-motion: reduce) { .appbar-progress i { transition: none; } }

#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas);z-index:100}
#gate form{display:grid;gap:12px;width:min(320px,86vw)}
#gate h1{font-size:var(--fs-l);margin:0;font-weight:600}
#gate input{height:36px;border-radius:8px;border:0;background:var(--surface-raised);padding:0 12px;font-size:var(--fs-m)}
#gate .err{font-size:var(--fs-s);color:var(--text-2);min-height:18px}
#app{display:none}
.appbar{overflow-x:auto}
#main{padding:calc(var(--appbar-h) + 24px) 24px 64px;max-width:1500px;margin:0 auto}
h1#ttl{margin:0 0 12px;font-size:var(--fs-xl);font-weight:600}
h2{font-size:var(--fs-l);font-weight:600;margin:40px 0 12px}
#sum{margin:0;padding:0;list-style:none;max-width:92ch;display:grid;gap:8px}
#sum li{padding-left:16px;position:relative} #sum li:before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-s)}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--text-2);background:var(--surface-side);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap} td small{display:block;color:var(--text-3)}
td.pl{white-space:nowrap;font-weight:600} tr.ref td.pl{color:var(--accent)}
#tbl td:nth-child(2){min-width:220px}
.v{display:inline-block;padding:1px 9px;border-radius:10px;font-size:var(--fs-xs);font-weight:600;line-height:18px;white-space:nowrap;background:var(--surface-raised);color:var(--text-2)}
.v.yes{background:rgba(48,209,88,.16);color:#6fe08c} .v.no{background:rgba(255,69,58,.18);color:#ff8078} .v.ref{background:rgba(245,200,76,.16);color:var(--accent)}
.blk{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.blk h2{margin:0 0 4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.blk .ln{margin:0 0 4px;max-width:92ch} .blk .u{font-size:var(--fs-s);color:var(--text-3)}
.pair{margin-top:20px} .pair.tall{max-width:760px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:8px} .ph b{font-size:var(--fs-m);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#000;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.th{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;background:var(--surface-side)}
.th b{flex:1;font-size:var(--fs-s);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tile.main .th b{color:var(--accent)}
.th button{appearance:none;border:0;background:transparent;color:var(--text-2);height:26px;min-width:26px;padding:0 6px;flex:none;border-radius:6px;cursor:pointer;font-size:var(--fs-xs)}
.th button:hover{background:var(--surface-raised);color:var(--text)} .th button.on{background:var(--accent);color:var(--accent-ink)}
.tb{position:relative;background:#000;cursor:pointer}
.tb video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tb .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:var(--fs-s);color:var(--text-2);background:var(--surface-empty)}
.tn{font-size:var(--fs-xs);color:var(--text-2);padding:6px 12px 8px;background:var(--surface-side);font-variant-numeric:tabular-nums}
.tn i{font-style:normal;color:var(--text-3)}
.tile:fullscreen .tb{flex:1;aspect-ratio:auto!important}
.pc{margin:8px 0 0;font-size:var(--fs-s);color:var(--text-2)}
.none{margin-top:16px;padding:20px;border-radius:8px;background:var(--surface-empty);color:var(--text-2);font-size:var(--fs-s)}
#cav{margin:0;padding-left:18px;max-width:92ch;color:var(--text-2);font-size:var(--fs-s);display:grid;gap:6px}
@media(max-width:760px){#main{padding-left:16px;padding-right:16px}}
@media(max-width:520px){.pair:not(.tall) .two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate"><form><h1>MAGI-2 — Эксклюзив</h1><input type="password" placeholder="Пароль" autocomplete="current-password" autofocus><button class="btn" type="submit">Открыть</button><div class="err"></div></form></div>
<div id="app">
<header class="appbar">
  <nav class="segmented" aria-label="Разделы"><a href="index.html">Знаменитости</a><a href="genjutsu.html">Genjutsu dev</a><a class="on" href="exclusive.html" aria-current="page">Эксклюзив</a></nav>
  <div class="appbar-status" id="ptext"></div>
</header>
<main id="main">
  <h1 id="ttl"></h1>
  <ul id="sum"></ul>
  <h2 class="hh"></h2>
  <div class="wrap"><table id="tbl"></table></div>
  <div id="blocks"></div>
  <h2 class="hh"></h2>
  <ul id="cav"></ul>
  <h2 class="hh"></h2>
  <div class="wrap"><table id="facts"></table></div>
</main>
</div>
<script>
(function(){
"use strict";
var SALT="8AAPMC27wmFHDRaEHhLbYA==",ITER=600000,KN="magi2-k-9502b677",key=null,D=null,urls={},sets=[];
var $=function(s){return document.querySelector(s);};
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function toB64(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
async function derive(pw){var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,256);return new Uint8Array(bits);}
async function dec(name){var r=await fetch("x/"+name+".bin");if(!r.ok)throw new Error("fetch");var b=new Uint8Array(await r.arrayBuffer());
  return await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12));}
async function open(raw){key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);D=JSON.parse(new TextDecoder().decode(await dec("page")));
  try{localStorage.setItem(KN,toB64(raw));}catch(e){}
  $("#gate").style.display="none";$("#app").style.display="block";start();}
$("#gate form").addEventListener("submit",async function(e){e.preventDefault();var err=$("#gate .err");err.textContent="Проверяю…";
  try{await open(await derive($("#gate input").value));}catch(x){err.textContent="Неверный пароль";}});
(async function(){try{var s=localStorage.getItem(KN);if(s)await open(b64(s));}catch(e){try{localStorage.removeItem(KN);}catch(_){}}})();
function blobUrl(m){if(!urls[m.n])urls[m.n]=dec(m.n).then(function(b){return URL.createObjectURL(new Blob([b],{type:m.t}));});return urls[m.n];}
function vcls(v){return D.L.vc[v]||"";}
function badge(v){return '<span class="v '+vcls(v)+'">'+esc(v)+'</span>';}
function hd(a){return "<tr>"+a.map(function(x){return "<th>"+esc(x)+"</th>";}).join("")+"</tr>";}
function num(x,d){return x.toFixed(d).replace(".",",");}
function facts(f){return f.w+"×"+f.h+" · "+esc(f.fpsT)+" · "+num(f.dur,2)+" "+esc(f.mk)+' <i>· '+esc(f.file)+'</i>';}
function tile(c,cls,id){return '<div class="tile '+cls+'" id="'+id+'"><div class="th"><b>'+esc(c.who)+'</b><button data-a="snd" title="Звук этой плитки" hidden>♪</button><button data-a="fs" title="На весь экран">⤢</button></div><div class="tb"><div class="msg">загружаю…</div></div><div class="tn">'+facts(c.f)+'</div></div>';}
function start(){
  $("#ttl").textContent=D.title;
  D.L.h.forEach(function(t,i){document.querySelectorAll("h2.hh")[i].textContent=t;});
  $("#sum").innerHTML=D.summary.map(function(s){return "<li>"+esc(s)+"</li>";}).join("");
  $("#cav").innerHTML=D.caveats.map(function(s){return "<li>"+esc(s)+"</li>";}).join("");
  var r=D.ref,h=hd(D.L.t1);
  h+='<tr class="ref"><td class="pl">'+esc(r.name)+'</td><td>'+esc(D.L.ref)+'</td><td>—</td><td class="n">'+esc(r.fps)+'</td><td class="n">'+esc(r.dur)+'</td><td>'+esc(r.producer)+'<small>'+esc(r.note)+'</small></td><td>'+badge(D.L.refv)+'</td></tr>';
  D.platforms.forEach(function(p){h+='<tr><td class="pl">'+esc(p.name)+'<small>'+esc(p.url)+'</small></td><td>'+esc(p.claim)+'</td><td class="n">'+esc(p.price)+'</td><td class="n">'+esc(p.fps)+'</td><td class="n">'+esc(p.dur)+'</td><td>'+esc(p.mark)+'</td><td>'+badge(p.verdict)+'</td></tr>';});
  $("#tbl").innerHTML=h;
  var f=hd(D.L.t2);
  D.facts.forEach(function(x){f+='<tr><td class="pl">'+esc(x.platform)+'</td><td>'+esc(x.file)+'</td><td class="n">'+esc(x.size)+'</td><td class="n">'+esc(x.fps)+'</td><td class="n">'+esc(x.dur)+'</td><td>'+esc(x.mark)+'</td><td class="n">'+esc(x.id||"—")+'</td><td class="n">'+esc(x.encoder)+'</td></tr>';});
  $("#facts").innerHTML=f;
  var b="",k=0;sets=[];
  D.platforms.forEach(function(p){b+='<section class="blk" id="'+esc(p.id)+'"><h2>'+esc(p.name)+" "+badge(p.verdict)+'</h2><p class="ln">'+esc(p.line)+'</p><div class="u">'+esc(p.url)+' · '+esc(p.price)+'</div>';
    if(!p.pairs.length)b+='<div class="none">'+esc(D.L.none)+'</div>';
    p.pairs.forEach(function(q){var i=k++;sets.push({q:q,v:[],on:false,snd:null,loaded:false});
      b+='<div class="pair'+(q.tall?" tall":"")+'" data-i="'+i+'" style="--ar:'+q.ar+'"><div class="ph"><button class="btn" data-a="play">Пуск</button><b>'+esc(q.test)+'</b></div><div class="two">'+tile(q.a,"","p"+i+"a")+tile(q.b,"main","p"+i+"b")+'</div><p class="pc">'+esc(q.conclusion)+'</p></div>';});
    b+="</section>";});
  $("#blocks").innerHTML=b;
  Array.prototype.forEach.call(document.querySelectorAll(".pair .tb"),function(e){e.style.aspectRatio=e.closest(".pair").style.getPropertyValue("--ar");});
    $("#ptext").innerHTML=esc(D.L.status);
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);load(+e.target.dataset.i);}});},{rootMargin:"500px"});
  Array.prototype.forEach.call(document.querySelectorAll(".pair"),function(e){io.observe(e);});
  if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}
}
function load(i){var s=sets[i];if(s.loaded)return;s.loaded=true;
  [["a",s.q.a],["b",s.q.b]].forEach(function(j){var t=document.getElementById("p"+i+j[0]),body=t.querySelector(".tb");
    if(!j[1].m){body.innerHTML='<div class="msg">Файла нет</div>';return;}
    blobUrl(j[1].m).then(function(u){var v=document.createElement("video");v.src=u;v.muted=true;v.playsInline=true;v.preload="auto";body.innerHTML="";body.appendChild(v);s.v.push(v);
      t.querySelector("[data-a=snd]").hidden=false;v.addEventListener("ended",function(){var all=s.v.every(function(x){return x.ended||x.paused;});if(all&&s.on){s.v.forEach(function(x){x.currentTime=0;});go(i,true);}});
      if(s.on)v.play().catch(function(){});
    }).catch(function(){body.innerHTML='<div class="msg">Не удалось загрузить</div>';});});}
function go(i,on){var s=sets[i];if(on)sets.forEach(function(o,k){if(k!==i&&o.on)go(k,false);});
  s.on=on;document.querySelector('.pair[data-i="'+i+'"] [data-a=play]').textContent=on?"Пауза":"Пуск";
  if(on){var t=s.v.length?s.v[0].currentTime:0;s.v.forEach(function(v,k){if(k&&Math.abs(v.currentTime-t)>0.15&&t<(v.duration||1e9))v.currentTime=t;var p=v.play();if(p&&p.catch)p.catch(function(){});});}
  else s.v.forEach(function(v){v.pause();});}
$("#blocks").addEventListener("click",function(e){var pr=e.target.closest(".pair");if(!pr)return;var i=+pr.dataset.i,s=sets[i],b=e.target.closest("[data-a]"),t=e.target.closest(".tile");
  if(!b){if(e.target.closest(".tb"))go(i,!s.on);return;}
  if(b.dataset.a==="play")go(i,!s.on);
  if(b.dataset.a==="fs"&&t){if(document.fullscreenElement)document.exitFullscreen();else if(t.requestFullscreen)t.requestFullscreen();}
  if(b.dataset.a==="snd"&&t){var v=t.querySelector("video");if(!v)return;s.snd=s.snd===v?null:v;s.v.forEach(function(x){x.muted=x!==s.snd;});
    Array.prototype.forEach.call(pr.querySelectorAll("[data-a=snd]"),function(x){x.classList.toggle("on",x.closest(".tile").querySelector("video")===s.snd);});}});
})();
</script>
</body>
</html>
