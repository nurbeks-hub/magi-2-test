<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MAGI-2 — Genjutsu dev</title>
<style>
/* Shared look for every tab of the comparison site (Стресс-сет, Genjutsu).
   Tokens first; then the app bar with tabs and the run line. See STYLE.md. */
:root {
  color-scheme: dark;
  /* surfaces, darkest to lightest */
  --surface-canvas: #1c1c1e;     /* page behind everything */
  --surface-side: #222224;       /* scene list, panels */
  --surface-raised: #2c2c2e;     /* fields, buttons, hover rows */
  --surface-video: #000;         /* behind video */
  --surface-empty: #18181a;      /* tile without a result */
  --line: rgba(255, 255, 255, .08);        /* hairline separators */
  --line-strong: rgba(255, 255, 255, .16);
  /* text */
  --text: #f2f2f7;
  --text-2: rgba(235, 235, 245, .62);
  --text-3: rgba(235, 235, 245, .36);
  /* the one accent: marks magi-2, selection, focus */
  --accent: #f5c84c;
  --accent-ink: #1c1c1e;          /* text on accent */
  /* status, used only in dots and the progress line */
  --ok: #30d158; --work: #ff9f0a; --bad: #ff453a; --idle: rgba(235, 235, 245, .22);
  /* type: one system family */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --fs-xs: 12px; --fs-s: 13px; --fs-m: 15px; --fs-l: 17px; --fs-xl: 22px;
  /* spacing on a 4 px step */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px;
  --radius: 8px; --radius-s: 6px;
  --appbar-h: 48px; --side-w: 288px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface-canvas); color: var(--text); }
body { font: 400 var(--fs-m)/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* buttons and fields, macOS-like */
.btn { appearance: none; background: var(--surface-raised); border: 0; border-radius: var(--radius-s);
  height: 28px; padding: 0 var(--sp-3); font-size: var(--fs-s); cursor: pointer; display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap; }
.btn:hover { background: #3a3a3c; }
.btn.plain { background: transparent; color: var(--text-2); }
.btn.plain:hover { background: var(--surface-raised); color: var(--text); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.field { appearance: none; background: var(--surface-raised); border: 0; border-radius: var(--radius-s); height: 28px; padding: 0 var(--sp-2); font-size: var(--fs-s); width: 100%; }
select.field { padding-right: 24px; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position: calc(100% - 13px) 12px, calc(100% - 9px) 12px; background-size: 4px 4px; background-repeat: no-repeat; }

/* segmented control */
.segmented { display: inline-flex; background: rgba(118, 118, 128, .24); border-radius: 7px; padding: 2px; gap: 2px; }
.segmented > * { appearance: none; border: 0; background: transparent; color: var(--text-2); font-size: var(--fs-s); height: 24px; padding: 0 var(--sp-3);
  border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; white-space: nowrap; }
.segmented > *:hover { color: var(--text); }
.segmented > .on { background: #636366; color: var(--text); font-weight: 500; }

/* app bar shared by all tabs */
.appbar { position: fixed; inset: 0 0 auto 0; height: var(--appbar-h); z-index: 30; display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-4); background: rgba(28, 28, 30, .92); backdrop-filter: saturate(160%) blur(20px); -webkit-backdrop-filter: saturate(160%) blur(20px);
  border-bottom: 1px solid var(--line); }
.appbar-status { flex: 1; min-width: 0; font-size: var(--fs-s); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-status b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.appbar-actions { display: flex; align-items: center; gap: var(--sp-2); }
.appbar-progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; display: flex; background: transparent; }
.appbar-progress i { display: block; height: 100%; width: 0; transition: width .4s ease; }
.appbar-progress .ok { background: var(--ok); } .appbar-progress .work { background: var(--work); } .appbar-progress .bad { background: var(--bad); }
@media (prefers-reduced-motion: reduce) { .appbar-progress i { transition: none; } }

#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas);z-index:100}
#gate form{display:grid;gap:12px;width:min(320px,86vw)}
#gate h1{font-size:var(--fs-l);margin:0;font-weight:600}
#gate input{height:36px;border-radius:8px;border:0;background:var(--surface-raised);padding:0 12px;font-size:var(--fs-m)}
#gate .err{font-size:var(--fs-s);color:var(--text-2);min-height:18px}
#app{display:none}
#side{position:fixed;top:var(--appbar-h);bottom:0;left:0;width:var(--side-w);background:var(--surface-side);border-right:1px solid var(--line);overflow-y:auto;padding:4px 8px 24px}
#side .g{font-size:var(--fs-xs);font-weight:600;color:var(--text-2);padding:16px 8px 4px}
#side button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:7px 8px;font-size:var(--fs-s);cursor:pointer;color:var(--text)}
#side button:hover{background:rgba(255,255,255,.04)} #side button.on{background:var(--surface-raised)}
#side button span.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none} .dot.done{background:var(--accent)} .dot.bad{background:var(--bad)} .dot.work{background:var(--work)}
#main{margin-left:var(--side-w);padding:calc(var(--appbar-h) + 16px) 24px 40px}
.meta{font-size:var(--fs-s);color:var(--text-2)} .meta b{color:var(--accent);font-weight:600}
h1#ttl{margin:2px 0 4px;font-size:var(--fs-xl);font-weight:600}
#chk{margin:0;color:var(--text-2);max-width:90ch}
.ip{display:inline-block;padding:0 7px;border-radius:9px;font-size:var(--fs-xs);line-height:18px;background:var(--surface-raised);color:var(--text-2)}
.ip.yes{background:rgba(255,69,58,.18);color:#ff8078} .ip.no{background:rgba(48,209,88,.16);color:#6fe08c}
#bar{display:flex;align-items:center;gap:12px;height:44px;margin-top:10px;position:sticky;top:var(--appbar-h);background:var(--surface-canvas);z-index:5}
#scrub{flex:1;accent-color:var(--accent)} .tm{font-size:var(--fs-s);color:var(--text-2);min-width:36px}
#grid{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));margin-top:8px}
.tile{background:#000;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.th{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;background:var(--surface-side)}
.th b{flex:1;font-size:var(--fs-s);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tile.main .th b{color:var(--accent)}
.th button{appearance:none;border:0;background:transparent;color:var(--text-2);height:26px;min-width:26px;padding:0 6px;flex:none;border-radius:6px;cursor:pointer;font-size:var(--fs-xs)}
.th button:hover{background:var(--surface-raised);color:var(--text)} .th button.on{background:var(--accent);color:var(--accent-ink)}
.tb{position:relative;aspect-ratio:var(--ar,9/16);background:#000}
.tb video,.tb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tb .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:var(--fs-s);color:var(--text-2);background:var(--surface-empty)}
.tn{font-size:var(--fs-xs);color:var(--text-3);padding:4px 12px 6px;background:var(--surface-side);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:fullscreen .tb{flex:1;aspect-ratio:auto}
#info{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:24px;border-top:1px solid var(--line);max-width:1600px}
#info h2{font-size:var(--fs-s);color:var(--text-2);font-weight:600;margin:16px 0 8px} #info pre{white-space:pre-wrap;font:var(--fs-s)/1.55 var(--font);margin:0}
#rev{font-size:var(--fs-m);max-width:72ch} #rev ul{color:var(--text-2);font-size:var(--fs-s);padding-left:18px}
@media(max-width:1100px){#info{grid-template-columns:1fr} :root{--side-w:230px}}
@media(max-width:760px){#side{position:static;width:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--line);margin-top:var(--appbar-h)} #main{margin-left:0;padding-top:16px} #grid{--cols:2!important}}
</style>
</head>
<body>
<div id="gate"><form><h1>MAGI-2 — Genjutsu dev</h1><input type="password" placeholder="Пароль" autocomplete="current-password" autofocus><button class="btn" type="submit">Открыть</button><div class="err"></div></form></div>
<div id="app">
<header class="appbar">
  <nav class="segmented" aria-label="Разделы"><a href="index.html">Знаменитости</a><a class="on" href="genjutsu.html" aria-current="page">Genjutsu dev</a><a href="exclusive.html">Эксклюзив</a></nav>
  <div class="appbar-status" id="ptext"></div>
</header>
<aside id="side"></aside>
<main id="main">
  <div class="meta" id="meta"></div><h1 id="ttl"></h1><p id="chk"></p>
  <div id="bar"><button class="btn" id="play">Пуск</button><span class="tm" id="tc">0:00</span><input id="scrub" type="range" min="0" max="1000" value="0"><span class="tm" id="td">0:00</span></div>
  <section id="grid"></section>
  <section id="info"><div><h2>Задание</h2><pre id="prompt"></pre></div><div><h2>Оценка Gemini</h2><div id="rev"></div></div></section>
</main>
</div>
<script>
(function(){
"use strict";
var SALT="8AAPMC27wmFHDRaEHhLbYA==",ITER=600000,KN="magi2-k-9502b677",key=null,D=null,cur=null,urls={},vids=[],master=null,playing=false,sound=null,scrubbing=false;
var $=function(s){return document.querySelector(s);};
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function toB64(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(t){t=Math.max(0,t||0);var m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s;}
async function derive(pw){var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,256);return new Uint8Array(bits);}
async function dec(name){var r=await fetch("g/"+name+".bin");if(!r.ok)throw new Error("fetch");var b=new Uint8Array(await r.arrayBuffer());
  return await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12));}
async function open(raw){key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);D=JSON.parse(new TextDecoder().decode(await dec("page")));
  try{localStorage.setItem(KN,toB64(raw));}catch(e){}
  $("#gate").style.display="none";$("#app").style.display="block";start();}
$("#gate form").addEventListener("submit",async function(e){e.preventDefault();var err=$("#gate .err");err.textContent="Проверяю…";
  try{await open(await derive($("#gate input").value));}catch(x){err.textContent="Неверный пароль";}});
(async function(){try{var s=localStorage.getItem(KN);if(s)await open(b64(s));}catch(e){try{localStorage.removeItem(KN);}catch(_){}}})();
function blobUrl(m){if(!m)return Promise.resolve(null);if(!urls[m.n])urls[m.n]=dec(m.n).then(function(b){return URL.createObjectURL(new Blob([b],{type:m.t}));});return urls[m.n];}
function byId(id){return D.cases.filter(function(c){return c.id===id;})[0];}
function devCell(c){return c.cells.filter(function(x){return x.key==="genjutsu_dev";})[0]||{};}
function list(){var h="",last=null;D.cases.forEach(function(c){if(c.cat!==last){h+='<div class="g">'+esc(c.cat)+'</div>';last=c.cat;}
  var d=devCell(c);h+='<button data-id="'+esc(c.id)+'" class="'+(c.id===cur?"on":"")+'" title="'+esc(c.title)+'"><span class="dot '+(d.m?"done":d.status==="bad"?"bad":d.status==="work"?"work":"")+'"></span><span class="t">'+esc(c.title)+'</span></button>';});
  $("#side").innerHTML=h;Array.prototype.forEach.call(document.querySelectorAll("#side button"),function(b){b.onclick=function(){show(b.dataset.id);};});}
function tile(cls,label,id,note){return '<div class="tile '+cls+'" id="'+id+'"><div class="th"><b>'+esc(label)+'</b><button data-a="snd" title="Звук этой плитки" hidden>♪</button><button data-a="fs" title="На весь экран">⤢</button></div><div class="tb"><div class="msg">загружаю…</div></div>'+(note?'<div class="tn">'+esc(note)+'</div>':'')+'</div>';}
function show(id){var c=byId(id);if(!c)return;pause();cur=id;try{history.replaceState(null,"","#"+encodeURIComponent(id));}catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll("#side button"),function(b){b.classList.toggle("on",b.dataset.id===id);});
  $("#meta").innerHTML="<b>"+esc(c.id)+"</b> · "+esc(c.group||c.cat)+" · "+c.dur+" с · "+esc(c.ar)+(c.en?" · "+esc(c.en):"")+(c.ip?' · <span class="ip '+(c.ip.label==="IP"?"yes":c.ip.label==="не IP"?"no":"")+'" title="'+esc(c.ip.why)+'">'+esc(c.ip.label)+"</span>":"");
  $("#ttl").textContent=c.title;$("#chk").textContent="Проверяет: "+c.checks;$("#prompt").textContent=c.prompt;
  var rv=c.review;$("#rev").innerHTML=rv?"<b>"+esc(rv.verdict||"")+"</b>"+(rv.summary?"<div>"+esc(rv.summary)+"</div>":"")+(rv.points&&rv.points.length?"<ul>"+rv.points.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul>":""):'<span style="color:var(--text-2)">Этот кейс Gemini ещё не смотрел.</span>';
  var h=tile("","Входное видео","t_in")+tile("","Референс","t_ref");
  c.cells.forEach(function(x,i){h+=tile(x.key==="genjutsu_dev"?"main":"",x.label,"t_c"+i,x.note);});
  var g=$("#grid"),n=2+c.cells.length,p=c.ar.split(":"),r=p[0]/p[1];g.innerHTML=h;g.style.setProperty("--cols",r<0.9?Math.min(n,5):r<1.2?Math.min(n,4):n<=4?2:3);g.style.setProperty("--ar",p[0]+" / "+p[1]);
  vids=[];master=null;sound=null;playing=false;$("#play").textContent="Пуск";$("#scrub").value=0;$("#tc").textContent="0:00";$("#td").textContent="0:00";
  var mine=id,jobs=[["t_in",c.video,"video"]];if(c.images[0])jobs.push(["t_ref",c.images[0],"img"]);else setMsg("t_ref","Без референса");
  c.cells.forEach(function(x,i){if(x.m)jobs.push(["t_c"+i,x.m,"video"]);else setMsg("t_c"+i,x.reason||"Нет ролика");});
  jobs.reduce(function(pr,j){return pr.then(function(){return blobUrl(j[1]).then(function(u){if(cur!==mine)return;var t=document.getElementById(j[0]);if(!t)return;var body=t.querySelector(".tb");
    if(!u){body.innerHTML='<div class="msg">Файла нет</div>';return;}
    var el=document.createElement(j[2]==="img"?"img":"video");el.src=u;body.innerHTML="";body.appendChild(el);
    if(j[2]==="video"){el.muted=true;el.playsInline=true;el.preload="auto";vids.push(el);t.querySelector('[data-a=snd]').hidden=false;
      if(j[0]==="t_in"){master=el;el.addEventListener("loadedmetadata",function(){$("#td").textContent=fmt(el.duration);});el.addEventListener("ended",function(){seek(0);if(playing)play();});}
      el.onclick=function(){playing?pause():play();};if(playing)el.play().catch(function(){});}
  }).catch(function(){setMsg(j[0],"Не удалось загрузить");});});},Promise.resolve());}
function setMsg(id,t){var e=document.getElementById(id);if(e)e.querySelector(".tb").innerHTML='<div class="msg">'+esc(t)+'</div>';}
function play(){if(!master)return;playing=true;$("#play").textContent="Пауза";vids.forEach(function(v){if(v===master||v.currentTime<(v.duration||1e9)-0.06){var p=v.play();if(p&&p.catch)p.catch(function(){});}});}
function pause(){playing=false;$("#play").textContent="Пуск";vids.forEach(function(v){v.pause();});}
function seek(t){vids.forEach(function(v){try{v.currentTime=Math.min(t,(v.duration||t)-0.03);}catch(e){}});}
function tick(){if(master&&master.duration){var t=master.currentTime;if(!scrubbing){$("#scrub").value=Math.round(1000*t/master.duration);$("#tc").textContent=fmt(t);}
  if(playing)vids.forEach(function(v){if(v===master||!v.duration)return;if(t>=v.duration-0.06){if(!v.paused)v.pause();return;}if(Math.abs(v.currentTime-t)>0.2)v.currentTime=t;if(v.paused&&!master.paused){var p=v.play();if(p&&p.catch)p.catch(function(){});}});}
  setTimeout(tick,200);}
$("#play").onclick=function(){playing?pause():play();};
$("#scrub").addEventListener("input",function(){scrubbing=true;if(master&&master.duration){var t=master.duration*$("#scrub").value/1000;seek(t);$("#tc").textContent=fmt(t);}});
$("#scrub").addEventListener("change",function(){scrubbing=false;});
$("#grid").addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var t=b.closest(".tile"),v=t.querySelector("video");
  if(b.dataset.a==="fs"){if(document.fullscreenElement)document.exitFullscreen();else if(t.requestFullscreen)t.requestFullscreen();}
  if(b.dataset.a==="snd"&&v){sound=sound===v?null:v;vids.forEach(function(x){x.muted=x!==sound;});Array.prototype.forEach.call(document.querySelectorAll("#grid [data-a=snd]"),function(s){s.classList.toggle("on",s.closest(".tile").querySelector("video")===sound);});}});
document.addEventListener("keydown",function(e){if(!D||e.target.tagName==="INPUT"&&e.target.type==="password")return;
  if(e.key===" "){e.preventDefault();playing?pause():play();}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="ArrowRight"||e.key==="ArrowLeft"){var i=D.cases.findIndex(function(c){return c.id===cur;});i+=(e.key==="ArrowDown"||e.key==="ArrowRight")?1:-1;if(D.cases[i]){show(D.cases[i].id);e.preventDefault();var b=document.querySelector("#side button.on");if(b)b.scrollIntoView({block:"nearest"});}}});
function start(){var n=D.cases.length,ok=D.cases.filter(function(c){return devCell(c).m;}).length;
  $("#ptext").innerHTML="Genjutsu dev (Render with Magi-2): готово <b>"+ok+"</b> из <b>"+n+"</b> · обновлено "+esc(D.updated);
  list();var h=decodeURIComponent(location.hash.slice(1));show(byId(h)?h:D.cases[0].id);tick();}
})();
</script>
</body>
</html>
